[package]
name = "jsonpath_rust_bindings"
version = "1.1.2"
edition = "2021"

[lib]
name = "jsonpath_rust_bindings"
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = "fat"
panic = "abort"
strip = true
codegen-units = 1
debug = false

[profile.dev]
opt-level = 1
debug = true

[dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module"] }
jsonpath-rust = "1.0.12"
serde_json = "1.0.154"
pythonize = "0.30.0"

[target.'cfg(any(not(target_os = "linux"), all(target_os = "linux", any(target_env = "musl", target_arch = "x86_64", target_arch = "x86"))))'.dependencies]
mimalloc = "0.1.52"
