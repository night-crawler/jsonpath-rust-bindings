name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build Jobs
  # These jobs will build the wheels for all Python versions and upload them as artifacts.
  linux:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64
            os: ubuntu-latest
          - target: aarch64
            os: ubuntu-latest
          - target: s390x
            os: ubuntu-latest
          - target: ppc64le
            os: ubuntu-latest
          - target: x86
            os: ubuntu-24.04
          - target: armv7
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build wheels for all Python versions
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: |
            --release
            --out target/wheels
            -i python3.9 python3.10 python3.11 python3.12 python3.13 python3.14 python3.15 pypy3.11 pypy3.12
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: target/wheels

  musllinux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, x86, aarch64, armv7]
    steps:
      - uses: actions/checkout@v7

      - name: Build wheels for all Python versions
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: |
            --release
            --out target/wheels
            -i python3.9 python3.10 python3.11 python3.12 python3.13 python3.14 python3.15 pypy3.11 pypy3.12
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-musllinux-${{ matrix.target }}
          path: target/wheels

  windows-x64:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install Python and PyPy versions
        shell: pwsh
        run: |
          uv python install 3.9 3.10 3.11 3.12 3.13 3.14 3.15 pypy3.11 pypy3.12

          $PYTHON_PATHS = @()
          $requests = @("3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "pypy3.11", "pypy3.12")

          foreach ($request in $requests) {
              $path = (uv python find $request).Trim()
              $PYTHON_PATHS += $path
              Write-Host "Found Python $request : $path"
          }

          $PYTHON_PATHS_STRING = $PYTHON_PATHS -join " "
          Write-Host "All Python paths: $PYTHON_PATHS_STRING"
          echo "PYTHON_PATHS=$PYTHON_PATHS_STRING" >> $env:GITHUB_ENV

      - name: Build wheels for all Python versions
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: |
            --release
            --out target/wheels
            -i ${{ env.PYTHON_PATHS }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x64
          path: target/wheels

  windows-x86:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build wheels for all Python versions
        uses: PyO3/maturin-action@v1
        with:
          target: x86
          args: |
            --release
            --out target/wheels
            -i python3.9 python3.10 python3.11 python3.12 python3.13 python3.14 python3.15
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x86
          path: target/wheels

  windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7

      - name: Build wheels for all Python versions
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64-pc-windows-msvc
          args: |
            --release
            --out target/wheels
            -i python3.11 python3.12 python3.13 python3.14 python3.15
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-arm64
          path: target/wheels

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7

      - name: Build wheels for all Python versions
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: |
            --release
            --out target/wheels
            -i python3.9 python3.10 python3.11 python3.12 python3.13 python3.14 python3.15 pypy3.11 pypy3.12
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: target/wheels

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out target/wheels
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: target/wheels

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'}}
    needs: [linux, musllinux, windows-x64, windows-x86, windows-arm64, macos, sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'wheels-*/*'
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*
